services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootPass2024!}
      MYSQL_DATABASE: ${DB_NAME:-sistema_notas}
      MYSQL_USER: ${DB_USER:-tecnico_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-TeCniCo2026}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - app_network

  api:
    build: .
    container_name: spring_api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URI: jdbc:mysql://mysql:3306/${DB_NAME:-sistema_notas}?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER:-tecnico_user}
      DB_PASSWORD: ${DB_PASSWORD:-TeCniCo2026}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
    ports:
      - "8080:8080"
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge